<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoShare - 分享精彩时刻</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-camera-retro"></i>
                <span>PhotoShare</span>
            </div>
            <div class="nav-search">
                <input type="text" id="searchInput" placeholder="搜索照片、视频或用户...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-link" id="homeLink"><i class="fas fa-home"></i><span>首页</span></a>
                <a href="#" class="nav-link" id="exploreLink"><i class="fas fa-compass"></i><span>发现</span></a>
                <a href="#" class="nav-link" id="hotLink"><i class="fas fa-fire"></i><span>热门</span></a>
                <a href="#" class="nav-link" id="discussionLink"><i class="fas fa-comments"></i><span>讨论</span></a>
            </div>
            <div class="nav-actions">
                <button class="nav-btn" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="nav-btn primary" id="uploadBtn">
                    <i class="fas fa-cloud-upload-alt"></i><span>上传</span>
                </button>
                <button class="nav-btn" id="profileBtn" style="display: none;">
                    <i class="fas fa-user-circle"></i>
                </button>
                <button class="nav-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i><span>登录</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 首页内容 -->
        <section id="homeSection" class="content-section active">
            <div class="section-header">
                <h1>发现精彩瞬间</h1>
                <p>分享你的照片和视频，记录美好时光</p>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="photos">照片</button>
                <button class="filter-btn" data-filter="videos">视频</button>
            </div>
            <div class="content-grid" id="homeGrid"></div>
            <div class="loading" id="homeLoading" style="display: none;">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </section>

        <!-- 发现页面 -->
        <section id="exploreSection" class="content-section">
            <div class="section-header">
                <h1>探索发现</h1>
                <p>发现更多精彩内容</p>
            </div>
            <div class="content-grid" id="exploreGrid"></div>
        </section>

        <!-- 热门内容 -->
        <section id="hotSection" class="content-section">
            <div class="section-header">
                <h1>热门内容</h1>
                <p>最受欢迎的照片和视频</p>
            </div>
            <div class="content-grid" id="hotGrid"></div>
        </section>

        <!-- 讨论区 -->
        <section id="discussionSection" class="content-section">
            <div class="section-header">
                <h1>讨论交流</h1>
                <p>与摄影爱好者交流心得</p>
            </div>
            <div class="discussion-container">
                <div class="discussion-input">
                    <textarea id="discussionText" placeholder="分享你的摄影心得..."></textarea>
                    <button id="postDiscussion" class="btn-primary">发布</button>
                </div>
                <div class="discussion-list" id="discussionList"></div>
            </div>
        </section>

        <!-- 个人资料页面 -->
        <section id="profileSection" class="content-section">
            <div class="profile-container" id="profileContainer"></div>
        </section>

        <!-- 搜索结果页面 -->
        <section id="searchResultsSection" class="content-section">
            <div class="section-header">
                <h1 id="searchTitle">搜索结果</h1>
            </div>
            <div class="content-grid" id="searchResultsGrid"></div>
        </section>
    </main>

    <!-- 上传模态框 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content upload-modal">
            <div class="modal-header">
                <h2>上传内容</h2>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="upload-tabs">
                    <button class="upload-tab active" data-type="photo">照片</button>
                    <button class="upload-tab" data-type="video">视频</button>
                </div>
                <form id="uploadForm">
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>点击或拖拽文件到这里</p>
                        <input type="file" id="fileInput" accept="image/*,video/*">
                    </div>
                    <div class="file-preview" id="filePreview"></div>
                    <div class="form-group">
                        <label>标题 *</label>
                        <input type="text" id="uploadTitle" required>
                    </div>
                    <div class="form-group">
                        <label>关键词 *（至少一个，用逗号分隔）</label>
                        <input type="text" id="uploadKeywords" required placeholder="风景,人像,摄影">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="uploadDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="uploadPrivate">
                            设为私密内容
                        </label>
                    </div>
                    <button type="submit" class="btn-primary">上传</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 登录/注册模态框 -->
    <div class="modal" id="authModal">
        <div class="modal-content auth-modal">
            <div class="modal-header">
                <h2 id="authTitle">登录</h2>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="auth-tabs">
                    <button class="auth-tab active" data-type="login">登录</button>
                    <button class="auth-tab" data-type="register">注册</button>
                </div>
                <form id="authForm">
                    <div class="form-group" id="nameGroup" style="display: none;">
                        <label>用户名</label>
                        <input type="text" id="authName">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="authEmail" required>
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="authPassword" required>
                    </div>
                    <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                        <label>确认密码</label>
                        <input type="password" id="authConfirmPassword">
                    </div>
                    <button type="submit" class="btn-primary" id="authSubmit">登录</button>
                </form>
                <div class="auth-divider">或</div>
                <button class="btn-google" id="googleAuthBtn">
                    <i class="fab fa-google"></i> 使用 Google 账号
                </button>
            </div>
        </div>
    </div>

    <!-- 图片/视频查看器 -->
    <div class="modal" id="viewerModal">
        <div class="modal-content viewer-modal">
            <button class="modal-close"><i class="fas fa-times"></i></button>
            <div class="viewer-container">
                <div class="viewer-main">
                    <div class="viewer-media" id="viewerMedia"></div>
                    <button class="viewer-prev" id="viewerPrev"><i class="fas fa-chevron-left"></i></button>
                    <button class="viewer-next" id="viewerNext"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="viewer-sidebar">
                    <div class="viewer-header">
                        <div class="viewer-author" id="viewerAuthor"></div>
                        <div class="viewer-actions">
                            <button class="action-btn" id="viewerLike">
                                <i class="far fa-heart"></i>
                                <span id="viewerLikeCount">0</span>
                            </button>
                            <button class="action-btn" id="viewerFollow">
                                <i class="far fa-user-plus"></i>
                            </button>
                            <button class="action-btn" id="viewerShare">
                                <i class="fas fa-share-alt"></i>
                            </button>
                        </div>
                    </div>
                    <div class="viewer-title" id="viewerTitle"></div>
                    <div class="viewer-keywords" id="viewerKeywords"></div>
                    <div class="viewer-description" id="viewerDescription"></div>
                    <div class="viewer-stats" id="viewerStats"></div>
                    <div class="viewer-comments">
                        <div class="comment-input">
                            <textarea id="commentText" placeholder="添加评论..."></textarea>
                            <button id="postComment" class="btn-primary">评论</button>
                        </div>
                        <div class="comments-list" id="commentsList"></div>
                    </div>
                    <div class="related-content">
                        <h3>相关内容</h3>
                        <div class="related-grid" id="relatedGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 个人信息编辑模态框 -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑个人资料</h2>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="editProfileForm">
                    <div class="form-group">
                        <label>头像</label>
                        <div class="avatar-upload">
                            <img id="avatarPreview" src="https://via.placeholder.com/150" alt="头像预览">
                            <input type="file" id="avatarInput" accept="image/*">
                            <button type="button" class="btn-upload">选择图片</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>个人简介</label>
                        <textarea id="editBio"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">保存</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script type="module" src="app.js"></script>
</body>
</html>
